name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Aynı PR'a yeni commit gelince önceki koşuyu iptal et — gereksiz runner
# kullanımını ve "hangi koşu geçerli?" belirsizliğini önler.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app main.py tests scripts

      - name: Type check
        run: mypy app main.py

      - name: Compile
        run: python -m compileall -q app main.py

      - name: Test
        run: python -m pytest tests -q

      - name: Check dependencies
        run: python -m pip check
