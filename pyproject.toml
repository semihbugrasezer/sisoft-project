[tool.ruff]
target-version = "py313"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

# python-telegram-bot tipler Update.message/effective_chat/Document alanlarını
# Optional işaretliyor (herhangi bir Update türünü kapsamak için) ama komut/mesaj
# handler'larına gelen gerçek Update'lerde bu alanlar runtime'da her zaman dolu —
# 45 union-attr false-positive üretiyordu. Guard eklemek (assert/if) her satırı
# genişletmeden ekstra bir davranış kazandırmaz; bu modülde bu tek kural kapatılır,
# geri kalan tüm mypy kontrolleri (arg-type, attr-defined, misc, ...) aktif kalır.
[[tool.mypy.overrides]]
module = "app.presentation.telegram.handlers"
disable_error_code = ["union-attr"]
